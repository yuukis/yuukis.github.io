<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#8203;</title> <!-- Zero Width Space (U+200B) -->
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .code-demo {
            margin-top: 24px;
            padding: 16px 20px;
            border: 1px solid #d0d7de;
            border-radius: 10px;
            background: #f6f8fa;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .code-demo h3 {
            margin: 0 0 12px;
            font-size: 1.1rem;
        }
        .code-demo code {
            display: block;
            white-space: pre-wrap;
            color: #24292f;
            line-height: 1.6;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <h1>title タグ空白 動作確認テストページ</h1>
    
    <h2>テスト内容</h2>
    <p>このページは title タグが Zero Width Space (U+200B)で設定されています。タイトルにページのURLが表示されるか、空文字で表示されるかを確認することができます。</p>

    <div class="code-demo">
        <h3>タイトルタグのコード例</h3>
        <code>&lt;title&gt;&amp;#8203;&lt;/title&gt;</code>
    </div>
</body>
</html>
